name: Validate

permissions:
  contents: read

env:
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: "43.288.0"
  # renovate: datasource=npm depName=oxfmt
  OXFMT_VERSION: "0.80.0"
  # renovate: datasource=npm depName=markdownlint-cli2
  MARKDOWNLINT_CLI2_VERSION: "0.24.2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "*.json"
      - "*.md"
      - "*.toml"
      - "*.jsonc"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "*.json"
      - "*.md"
      - "*.toml"
      - "*.jsonc"
      - ".github/workflows/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Renovate config
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator *.json

  oxfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install oxfmt
        run: npm install -g "oxfmt@${OXFMT_VERSION}"

      - name: Format check
        run: oxfmt --check .

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install markdownlint-cli2
        run: npm install -g "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"

      - name: Lint Markdown
        run: markdownlint-cli2 '**/*.md'

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4 # v1.84.1

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
